<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f2e9" />
  <title>CCAT Prep — Practice the Criteria Cognitive Aptitude Test</title>
  <meta name="description" content="The CCAT gives you 18 seconds a question, and almost nobody finishes. Practise the real format — 50 questions, 15 minutes — until it stops being scary. First full test is free." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Instrument Serif for authority, Plex Sans for structure, Plex Mono for
       every number the product shows. -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='6' fill='%23191512'/%3E%3Ctext x='50' y='73' font-size='68' font-family='Georgia,serif' fill='%23f6f2e9' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home" style="cursor:pointer">
      <span class="logo">C</span>
      <span>CCAT Prep<small>Cognitive Aptitude Trainer</small></span>
    </div>
    <nav class="nav">
      <button data-nav="home" class="active"><span class="label">Home</span></button>
      <button data-nav="study"><span class="label">Study Guide</span></button>
      <button data-nav="progress"><span class="label">Progress</span></button>
      <button data-nav="pricing" class="nav-upgrade" id="nav-pricing"><span class="label">Upgrade</span></button>
      <!-- Monochrome marks: a coloured emoji would be the only cartoon on an
           otherwise ink-and-paper page. -->
      <button class="icon-btn" id="account-btn" title="Account" aria-label="Account">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none"
             stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
          <circle cx="10" cy="6.6" r="3.1" /><path d="M3.8 16.8c0-3.4 2.8-5.3 6.2-5.3s6.2 1.9 6.2 5.3" />
        </svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Switch to ink (dark)" aria-label="Toggle paper / ink theme">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true">
          <circle cx="10" cy="10" r="6.6" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path d="M10 3.4a6.6 6.6 0 0 0 0 13.2z" fill="currentColor" />
        </svg>
      </button>
    </nav>
  </header>

  <main>
    <section id="view-home"     class="view"></section>
    <section id="view-category" class="view hidden"></section>
    <section id="view-drill"    class="view hidden"></section>
    <section id="view-quiz"     class="view hidden"></section>
    <section id="view-results"  class="view hidden"></section>
    <section id="view-review"   class="view hidden"></section>
    <section id="view-study"    class="view hidden"></section>
    <section id="view-progress" class="view hidden"></section>
    <section id="view-pricing"  class="view hidden"></section>
    <section id="view-account"  class="view hidden"></section>
  </main>

  <footer>
    Built for focused CCAT preparation ·
    <a href="#pricing" id="footer-pricing">Pricing</a> ·
    <a href="https://www.criteriacorp.com/" target="_blank" rel="noopener">About the official test ↗</a>
    <br />
    Independent study tool — not affiliated with or endorsed by Criteria Corp.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/paywall.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

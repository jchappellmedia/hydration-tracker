# stripe-webhook is called by Stripe, not by a signed-in user, so the platform
# JWT gate must be off; authenticity comes from the Stripe signature check
# inside the function. (Checkout itself happens on Stripe Payment Links — there
# is no checkout function to protect.)
[functions.stripe-webhook]
verify_jwt = false

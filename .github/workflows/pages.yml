name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "skillstack/**"
      - "index.html"
      - "css/**"
      - "js/**"
      # SEO landing pages + crawl files. Without these globs a new page would
      # merge to main and silently never deploy.
      - "ccat-scores/**"
      - "what-is-the-ccat/**"
      - "free-ccat-practice-test/**"
      - "sitemap.xml"
      - "reel/**"
      - "robots.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploys the payments webhook to the hydration-tracker Supabase project.
#
# NOTE: the payments backend is ALREADY LIVE — this workflow exists for future
# changes to supabase/functions/stripe-webhook. It is not part of initial
# setup. Checkout runs on Stripe Payment Links (no server-side Stripe key),
# and the webhook signing secret lives in the service-role-only ccat_config
# table, so this workflow needs exactly one repository secret.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal token from https://supabase.com/dashboard/account/tokens
name: Deploy payments backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-payments
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: utupgcayrwocavdmhyle
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy stripe-webhook
        # --no-verify-jwt: Stripe calls this endpoint with no Supabase JWT; the
        # function authenticates deliveries via the Stripe signature check.
        run: |
          supabase functions deploy stripe-webhook --no-verify-jwt --project-ref "$PROJECT_REF"

# Deploys the payments backend (both Edge Functions + their secrets) to the
# hydration-tracker Supabase project. Manual-trigger only, because it needs
# repository secrets that may not exist yet — running it without them should be
# a choice, not a red X on every push.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   personal token from https://supabase.com/dashboard/account/tokens
#   STRIPE_SECRET_KEY       sk_test_… / sk_live_… from the Stripe dashboard
#   STRIPE_WEBHOOK_SECRET   whsec_… — optional on the first run; add it after
#                           creating the webhook endpoint in Stripe, then re-run
name: Deploy payments backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-payments
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: utupgcayrwocavdmhyle
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Create one at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy Edge Functions
        # --no-verify-jwt on both, for different reasons: Stripe calls the
        # webhook with no Supabase JWT (its auth is the signature check inside
        # the function), and the checkout function must let the browser's CORS
        # preflight through (its real gate is the in-handler getUser() check).
        run: |
          supabase functions deploy stripe-checkout --no-verify-jwt --project-ref "$PROJECT_REF"
          supabase functions deploy stripe-webhook  --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Set function secrets
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          args=("ALLOWED_ORIGINS=https://jchappellmedia.github.io")
          if [ -n "$STRIPE_SECRET_KEY" ]; then
            args+=("STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY")
          else
            echo "::warning::STRIPE_SECRET_KEY is not set — checkout will stay unavailable until it is."
          fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then
            args+=("STRIPE_WEBHOOK_SECRET=$STRIPE_WEBHOOK_SECRET")
          else
            echo "::warning::STRIPE_WEBHOOK_SECRET is not set — add it after creating the webhook endpoint in Stripe, then re-run this workflow."
          fi
          supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF"

      - name: Summary
        run: |
          {
            echo "## Payments backend deployed"
            echo ""
            echo "- \`stripe-checkout\` and \`stripe-webhook\` are live on project \`$PROJECT_REF\`"
            echo "- Webhook URL for the Stripe dashboard:"
            echo ""
            echo "  \`https://$PROJECT_REF.supabase.co/functions/v1/stripe-webhook\`"
            echo ""
            echo "  Events: \`checkout.session.completed\`, \`checkout.session.async_payment_succeeded\`, \`charge.refunded\`"
          } >> "$GITHUB_STEP_SUMMARY"
